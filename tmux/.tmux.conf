# ---------- PREFIX KEY ----------
unbind C-a
set -g prefix C-b
bind C-b send-prefix

# ---------- WINDOW & PANE MANAGEMENT ----------
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Next / Prev windows
bind C-p previous-window
bind C-n next-window
bind a last-window

# Splits
bind-key v split-window -h
bind-key s split-window -v
bind-key -r h select-pane -L
bind-key -r j select-pane -D
bind-key -r k select-pane -U
bind-key -r l select-pane -R
bind-key C-o rotate-window

# ---------- COPY MODE ----------
setw -g mode-keys vi
bind-key [ copy-mode
bind-key ] paste-buffer
bind-key -T copy-mode-vi v send -X begin-selection
# y and Enter handled by tmux-yank plugin

# ---------- MOUSE ----------
setw -g mouse on
bind m set -g mouse on \; display-message "Mouse: ON"
bind M set -g mouse off \; display-message "Mouse: OFF"

# Drag-select → copy to macOS clipboard, then exit copy-mode
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; send-keys -X copy-pipe-no-clear "pbcopy"
bind-key -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; send-keys -X copy-pipe-no-clear "pbcopy"
# Right-click paste
bind-key -n MouseDown3Pane paste-buffer

# ---------- RELOAD CONFIG ----------
bind-key R source-file ~/.tmux.conf \; display-message "tmux.conf reloaded!"

# ---------- LAUNCHERS ----------
bind-key C new-window \; split-window -h -p 30 \; select-pane -L \; send-keys "claude" Enter
bind-key -r f display-popup -E "herdr-sessionizer"
bind-key -r i run-shell "tmux neww tmux-cht.sh"
bind -r D neww -c "#{pane_current_path}" "[[ -e scratch.md ]] && nvim scratch.md || nvim ~/.dotfiles/personal/scratch.md"
bind-key -r g run-shell "tmux neww lazygit"
bind-key -r t run-shell "tmux neww btop"
bind-key T run-shell "~/.local/bin/gruvbox-toggle"

# ---------- GENERAL SETTINGS ----------
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB,xterm-ghostty:RGB"
set -g repeat-time 500
set -s escape-time 0
set -g history-limit 100000
set -g display-time 3000
set -g focus-events on
set -g extended-keys on
set -g extended-keys-format csi-u
set -g window-size largest
set-window-option -g automatic-rename on
set-option -g set-titles on

# ---------- THEME: GRUVBOX ----------
set -g @plugin 'egel/tmux-gruvbox'
set -g @tmux-gruvbox 'light'   # dark | light | dark256 | light256 | dark-transparent | light-transparent
set-option -g status-position top

# ---------- TPM PLUGINS ----------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-yank'

set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'

# ---------- LOAD TPM ----------
run '~/.tmux/plugins/tpm/tpm'
